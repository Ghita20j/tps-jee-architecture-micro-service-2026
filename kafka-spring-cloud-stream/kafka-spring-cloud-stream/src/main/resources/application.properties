spring.application.name=kafka-spring-cloud-stream
server.port=8080

spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.kafka.streams.binder.brokers=localhost:9092
spring.cloud.stream.default-binder=kafka

# Fonctions actives
spring.cloud.function.definition=pageEventConsumer;pageEventSupplier;kStreamFunction;analyticsConsumer

# 1) Consumer : lit le topic T1 (alimenté par le RestController)
spring.cloud.stream.bindings.pageEventConsumer-in-0.destination=T1
spring.cloud.stream.bindings.pageEventConsumer-in-0.group=g1

# 2) Supplier : publie un PageEvent toutes les 200 ms dans T2
spring.cloud.stream.bindings.pageEventSupplier-out-0.destination=T2
spring.cloud.stream.bindings.pageEventSupplier-out-0.producer.poller.fixed-delay=200

# 3) Kafka Streams : T2 -> (filtre, fenetre 5s, count) -> T3
spring.cloud.stream.bindings.kStreamFunction-in-0.destination=T2
spring.cloud.stream.bindings.kStreamFunction-out-0.destination=T3
spring.cloud.stream.kafka.streams.binder.functions.kStreamFunction.applicationId=page-analytics-app
spring.cloud.stream.kafka.streams.binder.configuration.commit.interval.ms=1000

# 4) Consumer des resultats (log) sur T3
spring.cloud.stream.bindings.analyticsConsumer-in-0.destination=T3
spring.cloud.stream.bindings.analyticsConsumer-in-0.group=g-analytics
spring.cloud.stream.kafka.bindings.analyticsConsumer-in-0.consumer.configuration.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.cloud.stream.kafka.bindings.analyticsConsumer-in-0.consumer.configuration.value.deserializer=org.apache.kafka.common.serialization.LongDeserializer
spring.cloud.stream.bindings.analyticsConsumer-in-0.consumer.use-native-decoding=true
