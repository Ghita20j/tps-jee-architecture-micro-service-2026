spring.application.name=ebank-ai-agent
server.port=8070

# ---------- OpenAI ----------
# Ne JAMAIS ecrire la cle ici : definir la variable d'environnement OPENAI_API_KEY
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2

# ---------- Client MCP (Streamable HTTP) ----------
# Les micro-services doivent etre demarres AVANT l'agent.
spring.ai.mcp.client.name=ebank-mcp-client
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=60s
spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.streamable-http.connections.customer-service.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.account-service.url=http://localhost:8082

# ---------- Telegram (BotFather) ----------
telegram.bot.enabled=${TELEGRAM_ENABLED:false}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:EBankAssistantBot}

# ---------- Discord (Developer Portal) ----------
discord.bot.enabled=${DISCORD_ENABLED:false}
discord.bot.token=${DISCORD_BOT_TOKEN:}

logging.level.org.springframework.ai=INFO
