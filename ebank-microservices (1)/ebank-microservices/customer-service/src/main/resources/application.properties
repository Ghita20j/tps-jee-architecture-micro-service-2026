spring.application.name=customer-service
server.port=8081

# Config Service (optionnel : le service demarre meme si le config-service est arrete)
spring.config.import=optional:configserver:http://localhost:9999

# Base de donnees H2 en memoire -> console : http://localhost:8081/h2-console
spring.datasource.url=jdbc:h2:mem:customers-db
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=*

# Swagger UI -> http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Serveur MCP (Streamable HTTP) -> endpoint : http://localhost:8081/mcp
spring.ai.mcp.server.name=customer-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
