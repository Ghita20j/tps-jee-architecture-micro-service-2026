server:
  port: 8888

spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:http://localhost:9999
  cloud:
    gateway:
      server:
        webflux:
          # 1) Routage statique (lb:// = load balancing via Eureka)
          routes:
            - id: customer-service-route
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/api/customers/**
            - id: account-service-route
              uri: lb://ACCOUNT-SERVICE
              predicates:
                - Path=/api/accounts/**
          # 2) Routage dynamique : http://localhost:8888/customer-service/api/customers
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "*"
                allowed-methods: "*"
                allowed-headers: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
